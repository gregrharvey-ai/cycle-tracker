<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cycle &amp; Symptoms</title>
  <meta name="description" content="A private perimenopause tracker. Everything stays on your phone.">
  <meta name="theme-color" content="#faf6f1">
  <script>
    // Appearance: 'light' (default), 'dark', or 'auto' (match the phone). Applied before paint to avoid a flash.
    try {
      var a = localStorage.getItem('appearance') || 'light';
      if (a === 'dark' || (a === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1e1b1f');
      }
    } catch (e) { /* ignore */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Cycle">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" tabindex="-1" aria-live="polite"></main>

  <nav id="tabs" aria-label="Main">
    <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
    <a href="#/checkin" data-tab="checkin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11.5 11.5 14 16 9M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg><span>Check-in</span><i class="dot" id="checkin-dot" hidden></i></a>
    <a href="#/patterns" data-tab="patterns"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v15H4zM4 10h16M9 3v4M15 3v4"/></svg><span>Patterns</span></a>
    <a href="#/tips" data-tab="tips"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V17h5v-1.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3zM10 21h4"/></svg><span>Tips</span></a>
    <a href="#/more" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg><span>More</span></a>
  </nav>

  <div id="actions" hidden>
    <button type="button" class="bleed-btn" data-action="open-bleed">I'm bleeding</button>
    <button type="button" id="fab" data-action="open-quick">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Quick log</span>
    </button>
  </div>

  <div id="sheet-root" hidden>
    <div id="sheet-backdrop" data-action="close-sheet"></div>
    <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p style="padding:1rem">This app needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
