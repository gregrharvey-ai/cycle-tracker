<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cycle &amp; Symptoms</title>
  <meta name="description" content="A private perimenopause tracker. Everything stays on your phone.">
  <meta name="theme-color" content="#faf6f1">
  <script>
    // Appearance: 'light' (default), 'dark', or 'auto' (match the phone). Applied before paint to avoid a flash.
    try {
      var a = localStorage.getItem('appearance') || 'light';
      if (a === 'dark' || (a === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1e1b1f');
      }
    } catch (e) { /* ignore */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Cycle">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" tabindex="-1" aria-live="polite"></main>

  <nav id="tabs" aria-label="Main">
    <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><span>Today</span></a>
    <a href="#/checkin" data-tab="checkin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11.5 11.5 14 16 9M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg><span>Check-in</span><i class="dot" id="checkin-dot" hidden></i></a>
    <a href="#/patterns" data-tab="patterns"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Calendar</span></a>
    <a href="#/tips" data-tab="tips"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Learn</span></a>
    <a href="#/more" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg><span>More</span></a>
  </nav>

  <div id="actions" hidden>
    <button type="button" id="fab" data-action="open-quick">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Log a symptom</span>
    </button>
  </div>

  <div id="sheet-root" hidden>
    <div id="sheet-backdrop" data-action="close-sheet"></div>
    <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p style="padding:1rem">This app needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
